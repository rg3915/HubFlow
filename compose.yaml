services:
  db:
    image: postgres:18
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMAIL_HOST: mailpit
      REDIS_URL: redis://redis:6379/0
    # ASGI (uvicorn) para as conexões longas do tempo real (SSE); --reload recarrega como o runserver.
    command: uv run uvicorn hubflow.asgi:application --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3
    volumes:
      - ./backend:/app
      - /app/.venv
      - media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy

  # A cada 15 minutos: SLA e prazos (RN-111/112) e relatórios agendados (RN-121).
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMAIL_HOST: mailpit
      REDIS_URL: redis://redis:6379/0
    command: sh -c "while true; do uv run python manage.py check_sla; uv run python manage.py send_reports; sleep 900; done"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Anexos no modo S3 sem conta na AWS (SeaweedFS; as imagens do MinIO deixaram de ser públicas):
  # docker compose --profile s3 up -d e STORAGE_BACKEND=s3 no .env. Sem credenciais: só para desenvolvimento.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - s3data:/data
    ports:
      - "8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 3s
      retries: 30

  # Cria o bucket dos anexos.
  s3-init:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    depends_on:
      s3:
        condition: service_healthy
    env_file: .env
    entrypoint: ["sh", "-c", "echo \"s3.bucket.create -name $${AWS_STORAGE_BUCKET_NAME:-hubflow}\" | weed shell -master=s3:9333"]

volumes:
  pgdata:
  media:
  s3data:
