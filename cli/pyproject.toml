[project]
name = "hubflow"
version = "0.1.0"
description = "CLI do HubFlow: clientes, projetos e cards por linha de comando."
requires-python = ">=3.14"
dependencies = [
    "typer",
    "httpx",
    "python-decouple>=3.8",
]

[project.scripts]
hubflow = "hubflow_cli.main:app"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hubflow_cli"
module-root = ""

[dependency-groups]
dev = [
    "pytest",
    "respx",
    "ruff",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

# Atalhos de desenvolvimento: uv run task <nome>.
[tool.taskipy.tasks]
test = { cmd = "pytest", help = "roda a suíte da CLI" }
lint = { cmd = "ruff format . && ruff check --fix .", help = "formatação e lint" }
