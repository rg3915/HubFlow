[project]
name = "hubflow-backend"
version = "0.1.0"
description = "HubFlow: gestão de projetos e fluxos por cliente."
requires-python = ">=3.14"
dependencies = [
    "django==6.1.2",
    "django-ninja",
    "django-cors-headers",
    "psycopg[binary]",
    "python-decouple",
    "dj-database-url",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
    "pillow>=12.3.0",
    "django-storages[s3]>=1.14.6",
    "cloudinary>=1.46.3",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-django",
    "respx>=0.23.1",
    "ruff",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hubflow.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 119
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

# Atalhos de desenvolvimento: uv run task <nome> (uv run task --list mostra todos).
[tool.taskipy.tasks]
# DYLD_*: no macOS o WeasyPrint acha o pango do Homebrew (no Linux não muda nada).
test = { cmd = "DYLD_FALLBACK_LIBRARY_PATH=${DYLD_FALLBACK_LIBRARY_PATH:-/opt/homebrew/lib} pytest -W error", help = "roda a suíte do backend" }
lint = { cmd = "ruff check --fix . && ruff format .", help = "lint e formatação" }
makemigrations = { cmd = "python manage.py makemigrations", help = "gera migrations" }
migrate = { cmd = "docker compose exec -T backend uv run python manage.py migrate", help = "aplica as migrations no container" }
sync = { cmd = "docker compose exec -T backend uv sync --frozen && docker compose restart backend", help = "instala dependências novas no container e reinicia" }
