[project]
name = "hubflow-backend"
version = "0.1.0"
description = "HubFlow: gestão de projetos e fluxos por cliente."
requires-python = ">=3.14"
dependencies = [
    "django==6.1.2",
    "django-ninja",
    "django-cors-headers",
    "psycopg[binary]",
    "python-decouple",
    "dj-database-url",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
    "pillow>=12.3.0",
    "django-storages[s3]>=1.14.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-django",
    "respx>=0.23.1",
    "ruff",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hubflow.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 119
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
